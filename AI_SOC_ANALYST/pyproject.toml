[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-analyst"
version = "1.0.0"
description = "AI SOC ANALYST – Intelligent Security Investigation & Incident Response Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Propriétaire – usage interne" }
dependencies = [
    "PySide6-Essentials==6.8.1",
    "SQLAlchemy==2.0.36",
    "pydantic==2.10.4",
    "cryptography==44.0.0",
    "httpx==0.28.1",
    "Jinja2==3.1.6",
    "reportlab==4.2.5",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "pypdf==5.1.0",
    "python-evtx==0.8.1",
    "extract-msg==0.52.0",
    "PyYAML==6.0.4",
    "pefile==2024.8.26",
    "yara-python==4.5.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-qt==4.4.0", "pyinstaller==6.11.1", "pyinstaller-hooks-contrib==2026.10",
       "pySigma==2.1.2", "pysigma-backend-splunk==3.0.1"]

[project.scripts]
ai-soc-analyst = "ai_soc_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_soc_analyst = ["mitre/data/*.json", "reporting/templates/*.j2", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]
